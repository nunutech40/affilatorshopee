services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-affiliator}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-affiliator}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-affiliator} -d ${POSTGRES_DB:-affiliator}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://affiliator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-affiliator}?sslmode=disable}
      PORT: ${PORT:-8080}
      STORAGE_PATH: ${STORAGE_PATH:-/app/data/uploads}
      AI_API_KEY: ${AI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-stealth/ox-alpha}
      NINEROUTER_API_KEY: ${NINEROUTER_API_KEY:-}
      NINEROUTER_BASE_URL: ${NINEROUTER_BASE_URL:-https://9router.103-59-94-121.nip.io/v1}
      OPENCODE_API_KEY: ${OPENCODE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      ENV: ${ENV:-development}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./data/uploads:/app/data/uploads
      - ${HOME:-/Users/nununugraha}/.local/share/opencode/auth.json:/root/.local/share/opencode/auth.json:ro
      - ${HOME:-/Users/nununugraha}/.local/share/opencode/auth.json:/home/app/.local/share/opencode/auth.json:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
